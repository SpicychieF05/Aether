name: Release Android APK

on:
  push:
    tags:
      - 'v*' # Triggers ONLY when you push a version tag like v1.1.0, v1.2.0, etc.
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK using Gradle
        run: gradle assembleDebug --no-daemon

      - name: Extract Tag or Version Name
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.1.0"
          fi
          echo "VERSION_TAG=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Prepare APK & Calculate Checksum
        run: |
          mkdir -p output
          VERSION_TAG="${{ steps.get_version.outputs.VERSION_TAG }}"
          APK_FILE="output/Aether-${VERSION_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          cd output
          sha256sum "Aether-${VERSION_TAG}.apk" > checksum.txt
          cat checksum.txt
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-APK-${{ steps.get_version.outputs.VERSION_TAG }}
          path: output/

      - name: Publish GitHub Release (When Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get_version.outputs.VERSION_TAG }}
          tag_name: ${{ steps.get_version.outputs.VERSION_TAG }}
          files: |
            output/*.apk
            output/checksum.txt
          generate_release_notes: true
          draft: false
          prerelease: false
